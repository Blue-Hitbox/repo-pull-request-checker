name: 'AI Code Reviewer'
description: 'Review pull requests using AI via central dashboard'
inputs:
  provider:
    description: 'AI provider (openai, claude, openrouter)'
    required: false
    default: 'openai'
  model:
    description: 'AI model to use'
    required: false
  dashboard_url:
    description: 'URL of the central dashboard'
    required: false
  dashboard_api_secret:
    description: 'Secret for dashboard API access'
    required: false
  github_token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}
runs:
  using: 'node20'
  main: 'dist/action.js'
