services:
  # ------------------------------------------
  # PostgreSQL Database (local development)
  # ------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_reviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-ai_reviewer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_reviewer} -d ${POSTGRES_DB:-ai_reviewer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ------------------------------------------
  # SvelteKit Web Application
  # ------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ai_reviewer}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-ai_reviewer}?schema=public}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DASHBOARD_API_SECRET: ${DASHBOARD_API_SECRET}
      NODE_ENV: ${NODE_ENV:-development}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
